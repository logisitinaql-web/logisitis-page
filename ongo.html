    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اونقو فاست - Ongo Fast | تطبيق التوصيل السريع</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff4757;
            --primary-dark: #e84118;
            --secondary: #2ed573;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-light);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Hero Container */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px 30px;
            text-align: center;
            background: radial-gradient(circle at top, #2b1055 0%, #0f172a 70%);
        }

        .logo-area {
            margin-bottom: 20px;
        }

        .logo-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            font-size: 28px;
            font-weight: 800;
            padding: 12px 28px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(255, 71, 87, 0.4);
            letter-spacing: 1px;
        }

        .hero-title {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 12px;
            color: #ffffff;
            line-height: 1.3;
        }

        .hero-subtitle {
            font-size: 16px;
            color: var(--text-muted);
            max-width: 360px;
            margin: 0 auto 30px;
        }

        /* App Store Buttons */
        .download-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 320px;
            margin-bottom: 30px;
        }

        .btn-store {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background-color: var(--card-bg);
            color: var(--text-light);
            padding: 14px 20px;
            border-radius: 14px;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: transform 0.2s, border-color 0.2s;
        }

        .btn-store:active {
            transform: scale(0.98);
        }

        .btn-store.primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            box-shadow: 0 10px 25px rgba(255, 71, 87, 0.4);
        }

        .btn-icon {
            font-size: 24px;
        }

        .btn-text {
            display: flex;
            flex-direction: column;
            text-align: right;
        }

        .btn-text .small {
            font-size: 11px;
            opacity: 0.8;
        }

        .btn-text .big {
            font-size: 16px;
            font-weight: 700;
            line-height: 1.2;
        }

        /* Features Section */
        .features {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 360px;
            margin-bottom: 30px;
        }

        .feature-card {
            background: var(--card-bg);
            padding: 15px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 13px;
        }

        .feature-icon {
            font-size: 22px;
            margin-bottom: 6px;
        }

        .footer-note {
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="hero">
        <div>
            <div class="logo-area">
                <div class="logo-badge">ONGO FAST</div>
            </div>

            <h1 class="hero-title">تطبيق اونقو فاست<br>طلبك يوصلك بأسرع وقت!</h1>
            <p class="hero-subtitle">حمّل التطبيق الآن واستمتع بتجربة توصيل سريعة وسلسة لجميع طلباتك المفضلّة.</p>

            <!-- أزرار التحميل -->
            <div class="download-buttons">
                <!-- رابط App Store -->
                <a href="https://apps.apple.com/app/id6479567981" class="btn-store primary" target="_blank">
                    <span class="btn-icon"></span>
                    <div class="btn-text">
                        <span class="small">تحميل من متجر</span>
                        <span class="big">App Store</span>
                    </div>
                </a>

                <!-- رابط Google Play -->
                <a href="https://play.google.com/store/apps/details?id=khayber.delivery" class="btn-store" target="_blank">
                    <span class="btn-icon">▶</span>
                    <div class="btn-text">
                        <span class="small">احصل عليه من</span>
                        <span class="big">Google Play</span>
                    </div>
                </a>
            </div>

            <!-- المميزات السريعة -->
            <div class="features">
                <div class="feature-card">
                    <div class="feature-icon">⚡</div>
                    <strong>توصيل فائق السرعة</strong>
                </div>
                <div class="feature-card">
                    <div class="feature-icon">📍</div>
                    <strong>تتبع مباشر للطلب</strong>
                </div>
                <div class="feature-card">
                    <div class="feature-icon">🍔</div>
                    <strong>تنوع المتاجر</strong>
                </div>
                <div class="feature-card">
                    <div class="feature-icon">💳</div>
                    <strong> خيارات دفع متعددة</strong>
                </div>
            </div>
        </div>

        <div class="footer-note">
            جميع الحقوق محفوظة © اونقو فاست - Ongo Fast
        </div>
    </div>

</body>
</html>
