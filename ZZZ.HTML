<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b6b4c" />
    <title>نموذج متجر التموينات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true"><span></span></span>
          <div>
            <strong>اونقو</strong>
            <small>كل احتياجاتك، أسرع</small>
          </div>
        </div>
        <button class="icon-button notification-button" aria-label="الإشعارات">
          <span class="bell-icon">♢</span>
          <i></i>
        </button>
      </header>

      <main id="app" class="app-content"></main>

      <nav class="bottom-nav" aria-label="التنقل الرئيسي">
        <button class="nav-item active" data-nav="home"><span class="nav-icon">⌂</span><span>الرئيسية</span></button>
        <button class="nav-item" data-nav="categories"><span class="nav-icon grid-icon">⊞</span><span>الأقسام</span></button>
        <button class="nav-item cart-nav" data-nav="cart"><span class="nav-icon">🛒</span><span>السلة</span><b id="cartBadge">0</b></button>
        <button class="nav-item" data-nav="account"><span class="nav-icon">♙</span><span>حسابي</span></button>
      </nav>
    </div>

    <div id="modalRoot"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
